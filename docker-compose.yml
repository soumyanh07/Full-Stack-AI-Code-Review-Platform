version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ai-review-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_code_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: ai-review-redis
    ports:
      - "6379:6379"


  qdrant:
    image: qdrant/qdrant
    container_name: ai-review-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage


  gateway:
    build:
      context: ./gateway
    container_name: ai-review-gateway
    ports:
      - "8000:8000"
    depends_on:
      - postgres


  repository-service:
    build:
      context: ./services/repository-service
    container_name: ai-review-repository-service
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - qdrant


volumes:
  postgres_data:
  qdrant_data: